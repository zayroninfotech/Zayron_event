{% extends 'base.html' %}
{% block title %}Login — EventPhotoHub{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card p-4">
      <h4 class="mb-3 text-center">Organizer Login</h4>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
          </div>
        {% endfor %}
        <button class="btn btn-dark w-100" type="submit">Login</button>
      </form>
      <p class="text-center mt-3 small">No account? <a href="{% url 'register' %}">Register</a></p>
    </div>
  </div>
</div>
{% endblock %}
