{% extends 'base.html' %}
{% block title %}Delete Event — ZayroSnap{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 text-center">
      <i class="bi bi-exclamation-triangle-fill text-danger display-4 mb-3"></i>
      <h4>Delete "{{ event.name }}"?</h4>
      <p class="text-muted">This will permanently delete the event, all uploaded photos, and all guest matches. This cannot be undone.</p>
      <form method="post" class="d-flex gap-2 justify-content-center mt-3">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Yes, delete</button>
        <a href="{% url 'event_detail' event.slug %}" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
