{% extends 'base.html' %}
{% block title %}Delete Event — ZayroSnap{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 text-center" style="border-top-color:var(--zs-gold);">
      <div style="font-size:3rem;">⚠️</div>
      <h4 class="fw-bold mt-2" style="color:var(--zs-navy);">Delete "{{ event.name }}"?</h4>
      <p class="text-muted">This permanently deletes the event, all uploaded photos, and all guest matches. This cannot be undone.</p>
      <form method="post" class="d-flex gap-2 justify-content-center mt-3">
        {% csrf_token %}
        <button class="btn btn-danger px-4 fw-semibold" type="submit">Yes, Delete</button>
        <a href="{% url 'event_detail' event.slug %}" class="btn btn-outline-dark px-4">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
