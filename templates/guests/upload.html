{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find My Photos — {{ event.name }}</title>
  <link rel="icon" href="{% static 'img/zayrosnap_logo.png' %}" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      background: #F4F6FB;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 40px;
      color: #1a1f36;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 4px 32px rgba(10,15,60,.10);
      padding: 36px 32px 32px;
      border: 1px solid #E8EBF4;
    }

    /* Event info */
    .event-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: #1a1f36;
      margin-bottom: 4px;
      letter-spacing: -.3px;
    }
    .event-date {
      font-size: .82rem;
      color: #8492a6;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 28px;
    }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed #D1D5E8;
      border-radius: 18px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      margin-bottom: 20px;
      background: #FAFBFF;
    }
    .upload-zone:hover {
      border-color: #635BEB;
      background: #F5F4FF;
    }
    .upload-zone.has-image {
      border-style: solid;
      border-color: #635BEB;
      padding: 20px 16px;
      background: #F5F4FF;
    }

    .preview-circle {
      width: 120px; height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #635BEB;
      display: none;
      margin: 0 auto 12px;
    }
    .cam-wrap {
      width: 64px; height: 64px;
      border-radius: 18px;
      background: #EEEDFC;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
    }
    .cam-icon {
      font-size: 1.8rem;
      color: #635BEB;
    }
    .zone-text {
      font-size: .9rem;
      font-weight: 600;
      color: #1a1f36;
      margin-bottom: 4px;
    }
    .zone-sub {
      font-size: .76rem;
      color: #a0aec0;
    }
    .zone-change {
      font-size: .78rem;
      color: #635BEB;
      font-weight: 600;
      margin-top: 6px;
    }

    /* Submit */
    .btn-submit {
      width: 100%; height: 52px;
      border: none; border-radius: 12px; cursor: pointer;
      background: #635BEB;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 6px 20px rgba(99,91,235,.28);
      transition: background .2s, transform .15s, box-shadow .15s;
      letter-spacing: .01em;
    }
    .btn-submit:hover  { background: #4f47d0; box-shadow: 0 8px 24px rgba(99,91,235,.36); transform: translateY(-1px); }
    .btn-submit:active { transform: scale(.98); }
    .btn-submit:disabled { opacity: .65; cursor: default; transform: none; box-shadow: none; }

    .error-msg {
      color: #ef4444;
      font-size: .8rem;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    footer {
      margin-top: 24px;
      font-size: .72rem;
      color: #a0aec0;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    footer img.co-logo { height: 28px; width: auto; object-fit: contain; }
    footer a { color: #635BEB; text-decoration: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="event-name">{{ event.name }}</div>
  <div class="event-date"><i class="bi bi-calendar3"></i> {{ event.event_date }}</div>

  <form method="post" enctype="multipart/form-data" id="uploadForm">
    {% csrf_token %}

    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('selfieInput').click()">
      <img id="preview" class="preview-circle" src="" alt="Preview">
      <div class="cam-wrap" id="camWrap">
        <i class="bi bi-camera-fill cam-icon"></i>
      </div>
      <div class="zone-text" id="zoneText">Tap to upload your selfie</div>
      <div class="zone-sub" id="zoneSub">JPG · PNG · WEBP</div>
    </div>

    <input type="file" id="selfieInput" name="selfie"
           accept="image/*" capture="user" style="display:none" required
           onchange="previewSelfie(this)">

    {% if form.selfie.errors %}
      <div class="error-msg"><i class="bi bi-exclamation-circle"></i> {{ form.selfie.errors }}</div>
    {% endif %}

    <button type="submit" class="btn-submit" id="submitBtn">
      <i class="bi bi-search-heart"></i> Find My Photos
    </button>
  </form>
</div>

<footer>
  <img src="{% static 'img/logo1_cropped.png' %}" alt="Zayron Infotech" class="co-logo">
  Powered by <a href="#">ZayroSnap</a> — <strong>Zayron Infotech Pvt. Ltd</strong>
</footer>

<script>
function previewSelfie(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    const preview = document.getElementById('preview');
    preview.src = e.target.result;
    preview.style.display = 'block';
    document.getElementById('camWrap').style.display = 'none';
    document.getElementById('zoneText').textContent = 'Tap to change selfie';
    document.getElementById('zoneSub').style.display = 'none';
    document.getElementById('uploadZone').classList.add('has-image');
  };
  reader.readAsDataURL(input.files[0]);
}

document.getElementById('uploadForm').addEventListener('submit', function () {
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span style="width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;"></span> Searching…';
});
</script>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
