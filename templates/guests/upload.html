<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find My Photos — {{ event.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #0b1f4f 0%, #1a3a80 60%, #0d2a69 100%);
      display: flex; flex-direction: column; align-items: center;
      padding: 0 16px 40px;
      color: #fff;
    }

    /* Header */
    .top-bar {
      width: 100%; max-width: 480px;
      display: flex; align-items: center; gap: 10px;
      padding: 20px 0 28px;
    }
    .logo-box {
      width: 36px; height: 36px; border-radius: 9px;
      background: linear-gradient(135deg, #d69a16, #f3c65b);
      display: grid; place-items: center;
      font-size: 1.1rem; color: #111;
    }
    .logo-text { font-size: 1.1rem; font-weight: 800; }
    .logo-text span { color: #f3c65b; }

    /* Card */
    .card {
      width: 100%; max-width: 480px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(201,162,39,.3);
      border-radius: 20px;
      padding: 32px 28px;
      backdrop-filter: blur(8px);
    }

    .event-name {
      font-size: 1.25rem; font-weight: 800;
      margin-bottom: 4px;
    }
    .event-date {
      font-size: .85rem; color: rgba(255,255,255,.55);
      display: flex; align-items: center; gap: 5px;
      margin-bottom: 28px;
    }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed rgba(214,154,22,.55);
      border-radius: 16px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      margin-bottom: 24px;
    }
    .upload-zone:hover { border-color: #d69a16; background: rgba(214,154,22,.06); }
    .upload-zone.has-image { border-style: solid; border-color: #d69a16; padding: 16px; }

    .preview-circle {
      width: 130px; height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #d69a16;
      display: none;
      margin: 0 auto 10px;
    }
    .cam-icon { font-size: 3rem; color: #d69a16; display: block; margin-bottom: 10px; }
    .zone-text { font-size: .9rem; color: rgba(255,255,255,.6); }
    .zone-sub  { font-size: .78rem; color: rgba(255,255,255,.4); margin-top: 5px; }

    /* Submit button */
    .btn-submit {
      width: 100%; height: 54px;
      border: none; border-radius: 12px; cursor: pointer;
      background: linear-gradient(135deg, #b97804, #e3a91d);
      color: #fff; font-size: 1.05rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 8px 20px rgba(168,111,5,.3);
      transition: transform .2s, box-shadow .2s;
    }
    .btn-submit:hover  { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(168,111,5,.4); }
    .btn-submit:disabled { opacity: .6; transform: none; cursor: default; }

    .error-msg { color: #ff8080; font-size: .82rem; margin-top: 8px; }

    footer {
      margin-top: 32px;
      font-size: .75rem; color: rgba(255,255,255,.3); text-align: center;
    }
    footer span { color: #d69a16; }
  </style>
</head>
<body>

<!-- Header -->
<div class="top-bar">
  <div class="logo-box"><i class="bi bi-camera-fill"></i></div>
  <div class="logo-text">Zayro<span>Snap</span></div>
</div>

<!-- Card -->
<div class="card">
  <div class="event-name">{{ event.name }}</div>
  <div class="event-date"><i class="bi bi-calendar3"></i> {{ event.event_date }}</div>

  <form method="post" enctype="multipart/form-data" id="uploadForm">
    {% csrf_token %}

    <!-- Selfie upload zone -->
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('selfieInput').click()">
      <img id="preview" class="preview-circle" src="" alt="Preview">
      <i class="bi bi-camera-fill cam-icon" id="camIcon"></i>
      <div class="zone-text" id="zoneText">Tap to take or upload a selfie</div>
      <div class="zone-sub" id="zoneSub">JPG, PNG or WEBP</div>
    </div>

    <input type="file" id="selfieInput" name="selfie"
           accept="image/*" capture="user" style="display:none" required
           onchange="previewSelfie(this)">

    {% if form.selfie.errors %}
      <div class="error-msg">{{ form.selfie.errors }}</div>
    {% endif %}

    <button type="submit" class="btn-submit" id="submitBtn">
      <i class="bi bi-search-heart"></i> Find My Photos
    </button>
  </form>
</div>

<footer>© 2026 <span>ZayroSnap</span> — Powered by Zayron Infotech</footer>

<script>
function previewSelfie(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    const preview = document.getElementById('preview');
    const zone = document.getElementById('uploadZone');
    preview.src = e.target.result;
    preview.style.display = 'block';
    document.getElementById('camIcon').style.display = 'none';
    document.getElementById('zoneText').textContent = 'Tap to change selfie';
    document.getElementById('zoneSub').style.display = 'none';
    zone.classList.add('has-image');
  };
  reader.readAsDataURL(input.files[0]);
}

document.getElementById('uploadForm').addEventListener('submit', function () {
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-block;width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;"></span> Searching…';
});
</script>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</body>
</html>
